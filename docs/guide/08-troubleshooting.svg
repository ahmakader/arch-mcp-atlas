<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="If it does not work">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F5D56"/><stop offset=".55" stop-color="#16302C"/><stop offset="1" stop-color="#0A0B0F"/></linearGradient>
<radialGradient id="gl" cx="0" cy=".4" r=".75"><stop offset="0" stop-color="#F2904C" stop-opacity=".5"/><stop offset=".5" stop-color="#D3722A" stop-opacity=".1"/><stop offset="1" stop-color="#D3722A" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#F4EFE8" stroke-opacity=".06"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F2904C"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".4"/></filter>
</defs>
<rect width="960" height="540" rx="26" fill="url(#bg)"/><rect width="960" height="540" rx="26" fill="url(#grid)"/><rect width="960" height="540" rx="26" fill="url(#gl)"/>
<g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"><text x="40" y="70" font-size="34" font-weight="800" fill="#F4EFE8">If it does not work</text><text x="40" y="102" font-size="18" fill="#F4EFE8" fill-opacity=".78">Almost every problem is one of these six.</text><g filter="url(#sh)"><rect x="40" y="140" width="280" height="155" rx="18" fill="#F4EFE8"/></g><circle cx="72" cy="174" r="16" fill="#D3722A"/><text x="72" y="181" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0B0F">1</text><text x="98" y="180" font-size="17" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Server is missing</text><text x="62" y="220" font-size="15" font-weight="500" fill="#0A0B0F" fill-opacity="0.8" text-anchor="start">Quit Claude fully, not just</text><text x="62" y="242" font-size="15" font-weight="500" fill="#0A0B0F" fill-opacity="0.8" text-anchor="start">the window, and open it again.</text><g filter="url(#sh)"><rect x="340" y="140" width="280" height="155" rx="18" fill="#F4EFE8"/></g><circle cx="372" cy="174" r="16" fill="#D3722A"/><text x="372" y="181" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0B0F">2</text><text x="398" y="178" font-size="14.5" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">"spawn uvx" or "npx" error</text><text x="362" y="220" font-size="15" font-weight="500" fill="#0A0B0F" fill-opacity="0.8" text-anchor="start">Install uv or Node.js first,</text><text x="362" y="242" font-size="15" font-weight="500" fill="#0A0B0F" fill-opacity="0.8" text-anchor="start">or put the full path to it in</text><text x="362" y="264" font-size="15" font-weight="500" fill="#0A0B0F" fill-opacity="0.8" text-anchor="start">the config.</text><g filter="url(#sh)"><rect x="640" y="140" width="280" height="155" rx="18" fill="#F4EFE8"/></g><circle cx="672" cy="174" r="16" fill="#D3722A"/><text x="672" y="181" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0B0F">3</text><text x="698" y="180" font-size="17" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Config will not load</text><text x="662" y="220" font-size="15" font-weight="500" fill="#0A0B0F" fill-opacity="0.8" text-anchor="start">Check every quote, comma and</text><text x="662" y="242" font-size="15" font-weight="500" fill="#0A0B0F" fill-opacity="0.8" text-anchor="start">bracket. One missing comma</text><text x="662" y="264" font-size="15" font-weight="500" fill="#0A0B0F" fill-opacity="0.8" text-anchor="start">breaks it.</text><g filter="url(#sh)"><rect x="40" y="315" width="280" height="155" rx="18" fill="#F4EFE8"/></g><circle cx="72" cy="349" r="16" fill="#D3722A"/><text x="72" y="356" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0B0F">4</text><text x="98" y="355" font-size="17" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Software won't respond</text><text x="62" y="395" font-size="15" font-weight="500" fill="#0A0B0F" fill-opacity="0.8" text-anchor="start">Claude connects, but is the</text><text x="62" y="417" font-size="15" font-weight="500" fill="#0A0B0F" fill-opacity="0.8" text-anchor="start">plugin enabled and the server</text><text x="62" y="439" font-size="15" font-weight="500" fill="#0A0B0F" fill-opacity="0.8" text-anchor="start">started inside your software?</text><g filter="url(#sh)"><rect x="340" y="315" width="280" height="155" rx="18" fill="#F4EFE8"/></g><circle cx="372" cy="349" r="16" fill="#D3722A"/><text x="372" y="356" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0B0F">5</text><text x="398" y="355" font-size="17" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Two apps, one server</text><text x="362" y="395" font-size="15" font-weight="500" fill="#0A0B0F" fill-opacity="0.8" text-anchor="start">Run it from one AI app at a</text><text x="362" y="417" font-size="15" font-weight="500" fill="#0A0B0F" fill-opacity="0.8" text-anchor="start">time, for example not Claude</text><text x="362" y="439" font-size="15" font-weight="500" fill="#0A0B0F" fill-opacity="0.8" text-anchor="start">and Cursor together.</text><g filter="url(#sh)"><rect x="640" y="315" width="280" height="155" rx="18" fill="#F4EFE8"/></g><circle cx="672" cy="349" r="16" fill="#D3722A"/><text x="672" y="356" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0B0F">6</text><text x="698" y="355" font-size="17" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Still stuck</text><text x="662" y="395" font-size="13.5" font-weight="500" fill="#0A0B0F" fill-opacity="0.8" text-anchor="start">Read the log.</text><text x="662" y="417" font-size="13.5" font-weight="500" fill="#0A0B0F" fill-opacity="0.8" text-anchor="start">Mac: ~/Library/Logs/Claude</text><text x="662" y="439" font-size="13.5" font-weight="500" fill="#0A0B0F" fill-opacity="0.8" text-anchor="start">Windows: %APPDATA%\Claude\logs</text></g></svg>