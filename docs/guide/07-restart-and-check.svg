<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Restart Claude and check">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F5D56"/><stop offset=".55" stop-color="#16302C"/><stop offset="1" stop-color="#0A0B0F"/></linearGradient>
<radialGradient id="gl" cx="0" cy=".4" r=".75"><stop offset="0" stop-color="#F2904C" stop-opacity=".5"/><stop offset=".5" stop-color="#D3722A" stop-opacity=".1"/><stop offset="1" stop-color="#D3722A" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#F4EFE8" stroke-opacity=".06"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F2904C"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".4"/></filter>
</defs>
<rect width="960" height="540" rx="26" fill="url(#bg)"/><rect width="960" height="540" rx="26" fill="url(#grid)"/><rect width="960" height="540" rx="26" fill="url(#gl)"/>
<g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"><circle cx="64" cy="62" r="24" fill="#D3722A"/><text x="64" y="71" text-anchor="middle" font-size="26" font-weight="800" fill="#0A0B0F">5</text><text x="104" y="72" font-size="34" font-weight="800" fill="#F4EFE8">Restart Claude and check</text><text x="104" y="102" font-size="18" fill="#F4EFE8" fill-opacity=".78">Quit Claude completely, open it again, then look for your server.</text><g filter="url(#sh)"><rect x="40" y="140" width="300" height="330" rx="22" fill="#F4EFE8"/></g><rect x="80" y="172" width="64" height="64" rx="18" fill="#D3722A"/><line x1="112" y1="198.7" x2="112" y2="186.4" stroke="#F4EFE8" stroke-width="3.5" stroke-linecap="round" transform="rotate(0 112 204)"/><line x1="112" y1="198.7" x2="112" y2="182.0" stroke="#F4EFE8" stroke-width="3.5" stroke-linecap="round" transform="rotate(30 112 204)"/><line x1="112" y1="198.7" x2="112" y2="186.4" stroke="#F4EFE8" stroke-width="3.5" stroke-linecap="round" transform="rotate(60 112 204)"/><line x1="112" y1="198.7" x2="112" y2="182.0" stroke="#F4EFE8" stroke-width="3.5" stroke-linecap="round" transform="rotate(90 112 204)"/><line x1="112" y1="198.7" x2="112" y2="186.4" stroke="#F4EFE8" stroke-width="3.5" stroke-linecap="round" transform="rotate(120 112 204)"/><line x1="112" y1="198.7" x2="112" y2="182.0" stroke="#F4EFE8" stroke-width="3.5" stroke-linecap="round" transform="rotate(150 112 204)"/><line x1="112" y1="198.7" x2="112" y2="186.4" stroke="#F4EFE8" stroke-width="3.5" stroke-linecap="round" transform="rotate(180 112 204)"/><line x1="112" y1="198.7" x2="112" y2="182.0" stroke="#F4EFE8" stroke-width="3.5" stroke-linecap="round" transform="rotate(210 112 204)"/><line x1="112" y1="198.7" x2="112" y2="186.4" stroke="#F4EFE8" stroke-width="3.5" stroke-linecap="round" transform="rotate(240 112 204)"/><line x1="112" y1="198.7" x2="112" y2="182.0" stroke="#F4EFE8" stroke-width="3.5" stroke-linecap="round" transform="rotate(270 112 204)"/><line x1="112" y1="198.7" x2="112" y2="186.4" stroke="#F4EFE8" stroke-width="3.5" stroke-linecap="round" transform="rotate(300 112 204)"/><line x1="112" y1="198.7" x2="112" y2="182.0" stroke="#F4EFE8" stroke-width="3.5" stroke-linecap="round" transform="rotate(330 112 204)"/><text x="160" y="200" font-size="22" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Quit Claude</text><text x="160" y="224" font-size="16" font-weight="600" fill="#0A0B0F" fill-opacity="0.7" text-anchor="start">fully, then reopen</text><text x="64" y="284" font-size="16" font-weight="700" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Closing the window is not</text><text x="64" y="308" font-size="16" font-weight="700" fill="#0A0B0F" fill-opacity="1" text-anchor="start">enough. Use the menu:</text><text x="64" y="346" font-size="15" font-weight="600" fill="#0A0B0F" fill-opacity="0.75" text-anchor="start">Mac: Claude menu → Quit</text><text x="64" y="372" font-size="15" font-weight="600" fill="#0A0B0F" fill-opacity="0.75" text-anchor="start">Windows: tray icon →</text><text x="64" y="394" font-size="15" font-weight="600" fill="#0A0B0F" fill-opacity="0.75" text-anchor="start">right-click → Quit</text><rect x="64" y="424" width="232" height="30" rx="15" fill="#D3722A"/><text x="180" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#0A0B0F">Then open Claude again</text><path d="M350 305 L400 305" fill="none" stroke="#F2904C" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><g filter="url(#sh)"><rect x="410" y="140" width="510" height="330" rx="14" fill="#F4EFE8"/><path d="M410 176V154a14 14 0 0 1 14 -14H906a14 14 0 0 1 14 14V176z" fill="#E3DCD1"/></g><circle cx="430" cy="158" r="5" fill="#E5736B"/><circle cx="448" cy="158" r="5" fill="#E8B04A"/><circle cx="466" cy="158" r="5" fill="#5DBB73"/><text x="665.0" y="163" text-anchor="middle" font-size="13" font-weight="600" fill="#0A0B0F" fill-opacity=".65">Claude</text><rect x="436" y="352" width="458" height="58" rx="16" fill="#fff" stroke="#C9C0B3" stroke-width="2"/><text x="488" y="387" font-size="16" font-weight="500" fill="#0A0B0F" fill-opacity="0.45" text-anchor="start">Ask anything…</text><circle cx="466" cy="381" r="17" fill="#D3722A"/><text x="466" y="389" font-size="24" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="middle">+</text><rect x="443" y="358" width="46" height="46" rx="17" fill="none" stroke="#F2904C" stroke-width="4" stroke-dasharray="9 7"/><g filter="url(#sh)"><rect x="436" y="190" width="250" height="150" rx="14" fill="#16302C"/></g><text x="454" y="218" font-size="16" font-weight="800" fill="#F2904C" fill-opacity="1" text-anchor="start">Connectors</text><text x="454" y="252" font-size="14" font-weight="600" fill="#F4EFE8" fill-opacity="1" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">blender</text><rect x="632" y="236" width="38" height="20" rx="10" fill="#D3722A"/><circle cx="660" cy="246" r="7" fill="#F4EFE8"/><text x="454" y="282" font-size="14" font-weight="600" fill="#F4EFE8" fill-opacity="1" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">mcp-server-for-revit</text><rect x="632" y="266" width="38" height="20" rx="10" fill="#D3722A"/><circle cx="660" cy="276" r="7" fill="#F4EFE8"/><text x="454" y="312" font-size="14" font-weight="600" fill="#F4EFE8" fill-opacity="1" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">filesystem</text><rect x="632" y="296" width="38" height="20" rx="10" fill="#D3722A"/><circle cx="660" cy="306" r="7" fill="#F4EFE8"/><g filter="url(#sh)"><rect x="700" y="206" width="200" height="104" rx="14" fill="#F4EFE8"/></g><text x="714" y="232" font-size="14" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Try your first prompt</text><text x="714" y="256" font-size="14" font-weight="500" fill="#0A0B0F" fill-opacity="0.8" text-anchor="start">"What can you do in</text><text x="714" y="276" font-size="14" font-weight="500" fill="#0A0B0F" fill-opacity="0.8" text-anchor="start">Revit? List your tools."</text><text x="436" y="440" font-size="15" font-weight="700" fill="#F4EFE8" fill-opacity="0.9" text-anchor="start">You should see your server in the list, switched on.</text><text x="40" y="518" font-size="13" fill="#F4EFE8" fill-opacity=".5">Simplified illustration. Your screen may look slightly different.</text></g></svg>