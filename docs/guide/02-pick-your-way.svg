<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Pick your way in">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F5D56"/><stop offset=".55" stop-color="#16302C"/><stop offset="1" stop-color="#0A0B0F"/></linearGradient>
<radialGradient id="gl" cx="0" cy=".4" r=".75"><stop offset="0" stop-color="#F2904C" stop-opacity=".5"/><stop offset=".5" stop-color="#D3722A" stop-opacity=".1"/><stop offset="1" stop-color="#D3722A" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#F4EFE8" stroke-opacity=".06"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F2904C"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".4"/></filter>
</defs>
<rect width="960" height="540" rx="26" fill="url(#bg)"/><rect width="960" height="540" rx="26" fill="url(#grid)"/><rect width="960" height="540" rx="26" fill="url(#gl)"/>
<g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"><text x="40" y="70" font-size="34" font-weight="800" fill="#F4EFE8">Pick your way in</text><text x="40" y="102" font-size="18" fill="#F4EFE8" fill-opacity=".78">Check the server's README. It tells you which of these three it uses.</text><g filter="url(#sh)"><rect x="40" y="140" width="280" height="330" rx="22" fill="#F4EFE8"/></g><circle cx="80" cy="190" r="22" fill="#D3722A"/><text x="80" y="198" text-anchor="middle" font-size="24" font-weight="800" fill="#0A0B0F">A</text><text x="114" y="186" font-size="21" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Extension file</text><text x="114" y="208" font-size="14" font-weight="500" fill="#0A0B0F" fill-opacity="0.65" text-anchor="start">You have a .mcpb file</text><circle cx="76" cy="257" r="13" fill="#16302C"/><text x="76" y="262" text-anchor="middle" font-size="14" font-weight="800" fill="#F4EFE8">1</text><text x="100" y="262" font-size="17" font-weight="600" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Settings → Extensions</text><circle cx="76" cy="307" r="13" fill="#16302C"/><text x="76" y="312" text-anchor="middle" font-size="14" font-weight="800" fill="#F4EFE8">2</text><text x="100" y="312" font-size="17" font-weight="600" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Drag the file in</text><circle cx="76" cy="357" r="13" fill="#16302C"/><text x="76" y="362" text-anchor="middle" font-size="14" font-weight="800" fill="#F4EFE8">3</text><text x="100" y="362" font-size="17" font-weight="600" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Click Install</text><rect x="64" y="420" width="83" height="30" rx="15" fill="#16302C"/><text x="105" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#F4EFE8">Easiest</text><g filter="url(#sh)"><rect x="350" y="140" width="280" height="330" rx="22" fill="#F4EFE8"/></g><circle cx="390" cy="190" r="22" fill="#D3722A"/><text x="390" y="198" text-anchor="middle" font-size="24" font-weight="800" fill="#0A0B0F">B</text><text x="424" y="186" font-size="21" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Web address (URL)</text><text x="424" y="208" font-size="14" font-weight="500" fill="#0A0B0F" fill-opacity="0.65" text-anchor="start">The server is hosted online</text><circle cx="386" cy="257" r="13" fill="#16302C"/><text x="386" y="262" text-anchor="middle" font-size="14" font-weight="800" fill="#F4EFE8">1</text><text x="410" y="262" font-size="17" font-weight="600" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Customize → Connectors</text><circle cx="386" cy="307" r="13" fill="#16302C"/><text x="386" y="312" text-anchor="middle" font-size="14" font-weight="800" fill="#F4EFE8">2</text><text x="410" y="312" font-size="17" font-weight="600" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Add custom connector</text><circle cx="386" cy="357" r="13" fill="#16302C"/><text x="386" y="362" text-anchor="middle" font-size="14" font-weight="800" fill="#F4EFE8">3</text><text x="410" y="362" font-size="17" font-weight="600" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Paste the URL, click Add</text><rect x="374" y="420" width="232" height="30" rx="15" fill="#16302C"/><text x="490" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#F4EFE8">Nothing to install</text><g filter="url(#sh)"><rect x="660" y="140" width="280" height="330" rx="22" fill="#F4EFE8"/></g><rect x="660" y="140" width="280" height="330" rx="22" fill="none" stroke="#D3722A" stroke-width="5"/><circle cx="700" cy="190" r="22" fill="#D3722A"/><text x="700" y="198" text-anchor="middle" font-size="24" font-weight="800" fill="#0A0B0F">C</text><text x="734" y="186" font-size="21" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Config file</text><text x="734" y="208" font-size="14" font-weight="500" fill="#0A0B0F" fill-opacity="0.65" text-anchor="start">The server runs on your PC</text><circle cx="696" cy="257" r="13" fill="#16302C"/><text x="696" y="262" text-anchor="middle" font-size="14" font-weight="800" fill="#F4EFE8">1</text><text x="720" y="262" font-size="17" font-weight="600" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Settings → Developer</text><circle cx="696" cy="307" r="13" fill="#16302C"/><text x="696" y="312" text-anchor="middle" font-size="14" font-weight="800" fill="#F4EFE8">2</text><text x="720" y="312" font-size="17" font-weight="600" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Click Edit Config</text><circle cx="696" cy="357" r="13" fill="#16302C"/><text x="696" y="362" text-anchor="middle" font-size="14" font-weight="800" fill="#F4EFE8">3</text><text x="720" y="362" font-size="17" font-weight="600" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Paste, save, restart</text><rect x="684" y="420" width="232" height="30" rx="15" fill="#D3722A"/><text x="800" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#0A0B0F">Most architecture servers</text><text x="40" y="510" font-size="15" font-weight="600" fill="#F2904C" fill-opacity="1" text-anchor="start">Not sure? Start with the config file (C). Most MCP servers for architecture software use it.</text></g></svg>