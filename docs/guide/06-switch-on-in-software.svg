<g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"><circle cx="64" cy="62" r="24" fill="#D3722A"/><text x="64" y="71" text-anchor="middle" font-size="26" font-weight="800" fill="#0A0B0F">4</text><text x="104" y="72" font-size="34" font-weight="800" fill="#F4EFE8">Switch it on in your software</text><text x="104" y="102" font-size="18" fill="#F4EFE8" fill-opacity=".78">Many servers also need a plugin inside the program. These are two real examples.</text><g filter="url(#sh)"><rect x="40" y="130" width="440" height="340" rx="14" fill="#F4EFE8"/><path d="M40 166V144a14 14 0 0 1 14 -14H466a14 14 0 0 1 14 14V166z" fill="#E3DCD1"/></g><circle cx="60" cy="148" r="5" fill="#E5736B"/><circle cx="78" cy="148" r="5" fill="#E8B04A"/><circle cx="96" cy="148" r="5" fill="#5DBB73"/><text x="260.0" y="153" text-anchor="middle" font-size="13" font-weight="600" fill="#0A0B0F" fill-opacity=".65">Autodesk Revit</text><rect x="40" y="166" width="440" height="44" fill="#D9D1C4"/><text x="58" y="197" font-size="14" font-weight="600" fill="#0A0B0F" fill-opacity="0.7" text-anchor="start">Architecture</text><text x="184.8" y="197" font-size="14" font-weight="600" fill="#0A0B0F" fill-opacity="0.7" text-anchor="start">Structure</text><rect x="280.40000000000003" y="172" width="137" height="38" rx="8" fill="#D3722A"/><text x="291.40000000000003" y="197" font-size="14" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">mcp-servers…</text><rect x="60" y="232" width="120" height="44" rx="17" fill="#D3722A"/><text x="120.0" y="260" text-anchor="middle" font-size="17" font-weight="700" fill="#0A0B0F">Settings</text><rect x="54" y="226" width="132" height="56" rx="14" fill="none" stroke="#F2904C" stroke-width="4" stroke-dasharray="9 7"/><rect x="250" y="226" width="212" height="190" rx="14" fill="#fff" stroke="#D5CCBE" stroke-width="2"/><text x="264" y="254" font-size="14" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Choose the commands</text><rect x="268" y="272" width="18" height="18" rx="4" fill="#D3722A"/><path d="M272 281l4 4 7-8" stroke="#0A0B0F" stroke-width="2.5" fill="none"/><rect x="296" y="276" width="130" height="10" rx="5" fill="#0A0B0F" fill-opacity=".18"/><rect x="268" y="298" width="18" height="18" rx="4" fill="#D3722A"/><path d="M272 307l4 4 7-8" stroke="#0A0B0F" stroke-width="2.5" fill="none"/><rect x="296" y="302" width="112" height="10" rx="5" fill="#0A0B0F" fill-opacity=".18"/><rect x="268" y="324" width="18" height="18" rx="4" fill="#D3722A"/><path d="M272 333l4 4 7-8" stroke="#0A0B0F" stroke-width="2.5" fill="none"/><rect x="296" y="328" width="94" height="10" rx="5" fill="#0A0B0F" fill-opacity=".18"/><rect x="268" y="350" width="18" height="18" rx="4" fill="#D3722A"/><path d="M272 359l4 4 7-8" stroke="#0A0B0F" stroke-width="2.5" fill="none"/><rect x="296" y="354" width="76" height="10" rx="5" fill="#0A0B0F" fill-opacity=".18"/><rect x="352" y="380" width="92" height="28" rx="11" fill="#D3722A"/><text x="398.0" y="399" text-anchor="middle" font-size="14" font-weight="700" fill="#0A0B0F">Save</text><text x="60" y="312" font-size="15" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">1  Open the tab</text><text x="60" y="338" font-size="15" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">2  Click Settings</text><text x="60" y="364" font-size="15" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">3  Enable commands</text><text x="60" y="390" font-size="15" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">4  Save</text><text x="60" y="436" font-size="13" font-weight="600" fill="#0A0B0F" fill-opacity="0.7" text-anchor="start">If Revit asks, choose "Always Load".</text><g filter="url(#sh)"><rect x="500" y="130" width="420" height="340" rx="14" fill="#1B2125"/><path d="M500 166V144a14 14 0 0 1 14 -14H906a14 14 0 0 1 14 14V166z" fill="#262E33"/></g><circle cx="520" cy="148" r="5" fill="#E5736B"/><circle cx="538" cy="148" r="5" fill="#E8B04A"/><circle cx="556" cy="148" r="5" fill="#5DBB73"/><text x="710.0" y="153" text-anchor="middle" font-size="13" font-weight="600" fill="#F4EFE8" fill-opacity=".65">Blender</text><rect x="510" y="172" width="236" height="288" fill="#2B3338"/><path d="M590 400l50-90 50 90z" fill="#2E8B7F" fill-opacity=".5"/><rect x="560" y="260" width="70" height="70" fill="#D3722A" fill-opacity=".5"/><rect x="752" y="166" width="164" height="298" fill="#20272B"/><text x="764" y="192" font-size="14" font-weight="800" fill="#F2904C" fill-opacity="1" text-anchor="start">MCP for Blender</text><rect x="764" y="208" width="140" height="34" rx="13" fill="#fff" stroke="#C9C0B3" stroke-width="2"/><text x="834.0" y="229" text-anchor="middle" font-size="12" font-weight="700" fill="#0A0B0F">Start MCP Server</text><rect x="764" y="254" width="140" height="34" rx="13" fill="#D3722A"/><text x="834.0" y="275" text-anchor="middle" font-size="12" font-weight="700" fill="#0A0B0F">Connect to Claude</text><rect x="758" y="248" width="152" height="46" rx="10" fill="none" stroke="#F2904C" stroke-width="4" stroke-dasharray="9 7"/><text x="764" y="322" font-size="13" font-weight="600" fill="#F4EFE8" fill-opacity="0.8" text-anchor="start">Press N in the 3D</text><text x="764" y="340" font-size="13" font-weight="600" fill="#F4EFE8" fill-opacity="0.8" text-anchor="start">view to open this</text><text x="764" y="358" font-size="13" font-weight="600" fill="#F4EFE8" fill-opacity="0.8" text-anchor="start">panel.</text><text x="764" y="396" font-size="13" font-weight="800" fill="#F4EFE8" fill-opacity="1" text-anchor="start">1  Start MCP Server</text><text x="764" y="418" font-size="13" font-weight="800" fill="#F4EFE8" fill-opacity="1" text-anchor="start">2  Connect to Claude</text><g filter="url(#sh)"><rect x="40" y="480" width="880" height="40" rx="12" fill="#F4EFE8"/></g><text x="60" y="506" font-size="15" font-weight="700" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Every server is different. Always follow its own README for this step.</text></g></svg>