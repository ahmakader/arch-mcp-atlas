<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Open the config file">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F5D56"/><stop offset=".55" stop-color="#16302C"/><stop offset="1" stop-color="#0A0B0F"/></linearGradient>
<radialGradient id="gl" cx="0" cy=".4" r=".75"><stop offset="0" stop-color="#F2904C" stop-opacity=".5"/><stop offset=".5" stop-color="#D3722A" stop-opacity=".1"/><stop offset="1" stop-color="#D3722A" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#F4EFE8" stroke-opacity=".06"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F2904C"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".4"/></filter>
</defs>
<rect width="960" height="540" rx="26" fill="url(#bg)"/><rect width="960" height="540" rx="26" fill="url(#grid)"/><rect width="960" height="540" rx="26" fill="url(#gl)"/>
<g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"><circle cx="64" cy="62" r="24" fill="#D3722A"/><text x="64" y="71" text-anchor="middle" font-size="26" font-weight="800" fill="#0A0B0F">2</text><text x="104" y="72" font-size="34" font-weight="800" fill="#F4EFE8">Open the config file</text><text x="104" y="102" font-size="18" fill="#F4EFE8" fill-opacity=".78">This is where Claude learns which servers to start.</text><g filter="url(#sh)"><rect x="40" y="130" width="640" height="340" rx="14" fill="#F4EFE8"/><path d="M40 166V144a14 14 0 0 1 14 -14H666a14 14 0 0 1 14 14V166z" fill="#E3DCD1"/></g><circle cx="60" cy="148" r="5" fill="#E5736B"/><circle cx="78" cy="148" r="5" fill="#E8B04A"/><circle cx="96" cy="148" r="5" fill="#5DBB73"/><text x="360.0" y="153" text-anchor="middle" font-size="13" font-weight="600" fill="#0A0B0F" fill-opacity=".65">Claude · Settings</text><rect x="40" y="166" width="170" height="304" fill="#E8E1D6"/><text x="68" y="202" font-size="17" font-weight="600" fill="#0A0B0F" fill-opacity="0.7" text-anchor="start">General</text><text x="68" y="246" font-size="17" font-weight="600" fill="#0A0B0F" fill-opacity="0.7" text-anchor="start">Extensions</text><rect x="52" y="266" width="146" height="36" rx="10" fill="#D3722A"/><text x="68" y="290" font-size="17" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Developer</text><text x="68" y="334" font-size="17" font-weight="600" fill="#0A0B0F" fill-opacity="0.7" text-anchor="start">Connectors</text><text x="236" y="206" font-size="24" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Developer</text><rect x="236" y="226" width="420" height="96" rx="14" fill="#fff" stroke="#D5CCBE" stroke-width="2"/><text x="256" y="258" font-size="18" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Local MCP servers</text><text x="256" y="284" font-size="14" font-weight="500" fill="#0A0B0F" fill-opacity="0.6" text-anchor="start">Servers on your computer.</text><rect x="500" y="252" width="140" height="44" rx="17" fill="#D3722A"/><text x="570.0" y="280" text-anchor="middle" font-size="17" font-weight="700" fill="#0A0B0F">Edit Config</text><rect x="494" y="246" width="152" height="56" rx="14" fill="none" stroke="#F2904C" stroke-width="4" stroke-dasharray="9 7"/><text x="236" y="360" font-size="15" font-weight="600" fill="#0A0B0F" fill-opacity="0.75" text-anchor="start">claude_desktop_config.json opens in your text editor.</text><g filter="url(#sh)"><rect x="710" y="150" width="210" height="150" rx="16" fill="#F4EFE8"/></g><text x="726" y="180" font-size="15" font-weight="700" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Open Settings from</text><text x="726" y="202" font-size="15" font-weight="700" fill="#0A0B0F" fill-opacity="1" text-anchor="start">the Claude menu at the</text><text x="726" y="224" font-size="15" font-weight="700" fill="#0A0B0F" fill-opacity="1" text-anchor="start">top of your screen,</text><text x="726" y="252" font-size="14" font-weight="500" fill="#0A0B0F" fill-opacity="0.65" text-anchor="start">not the settings inside</text><text x="726" y="272" font-size="14" font-weight="500" fill="#0A0B0F" fill-opacity="0.65" text-anchor="start">a chat.</text><g filter="url(#sh)"><rect x="710" y="320" width="210" height="150" rx="16" fill="#16302C" stroke="#D3722A" stroke-width="2"/></g><text x="726" y="350" font-size="14" font-weight="800" fill="#F2904C" fill-opacity="1" text-anchor="start">The file lives here</text><text x="726" y="376" font-size="13" font-weight="800" fill="#F4EFE8" fill-opacity="1" text-anchor="start">Mac</text><text x="726" y="394" font-size="11" font-weight="400" fill="#F4EFE8" fill-opacity="0.85" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">~/Library/Application</text><text x="726" y="408" font-size="11" font-weight="400" fill="#F4EFE8" fill-opacity="0.85" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">Support/Claude/</text><text x="726" y="432" font-size="13" font-weight="800" fill="#F4EFE8" fill-opacity="1" text-anchor="start">Windows</text><text x="726" y="450" font-size="11" font-weight="400" fill="#F4EFE8" fill-opacity="0.85" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">%APPDATA%\Claude\</text><text x="40" y="518" font-size="13" fill="#F4EFE8" fill-opacity=".5">Simplified illustration. Your screen may look slightly different.</text></g></svg>