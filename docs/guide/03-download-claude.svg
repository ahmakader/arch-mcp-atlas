xt-anchor="start">3. Install and sign in</text><g filter="url(#sh)"><rect x="700" y="400" width="220" height="86" rx="16" fill="#F4EFE8"/></g><text x="716" y="428" font-size="14" font-weight="600" fill="#0A0B0F" fill-opacity="0.7" text-anchor="start">Some servers also need</text><text x="716" y="454" font-size="20" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Node.js  or  uv</text><text x="716" y="476" font-size="12" font-weight="500" fill="#0A0B0F" fill-opacity="0.65" text-anchor="start">The server's README says which.</text><text x="40" y="518" font-size="13" fill="#F4EFE8" fill-opacity=".5">Simplified illustration. Your screen may look slightly different.</text></g></svg>