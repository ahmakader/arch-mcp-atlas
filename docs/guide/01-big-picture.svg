<rect width="960" height="540" rx="26" fill="url(#bg)"/><rect width="960" height="540" rx="26" fill="url(#grid)"/><rect width="960" height="540" rx="26" fill="url(#gl)"/>
<g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"><text x="40" y="70" font-size="34" font-weight="800" fill="#F4EFE8">How it fits together</text><text x="40" y="102" font-size="18" fill="#F4EFE8" fill-opacity=".78">Claude is the brain. The MCP server is the helper. Your software does the work.</text><g filter="url(#sh)"><rect x="40" y="150" width="250" height="230" rx="24" fill="#F4EFE8"/></g><rect x="115" y="180" width="100" height="100" rx="26" fill="#D3722A"/><line x1="165" y1="221.8" x2="165" y2="202.8" stroke="#F4EFE8" stroke-width="5.4" stroke-linecap="round" transform="rotate(0 165 230)"/><line x1="165" y1="221.8" x2="165" y2="196.0" stroke="#F4EFE8" stroke-width="5.4" stroke-linecap="round" transform="rotate(30 165 230)"/><line x1="165" y1="221.8" x2="165" y2="202.8" stroke="#F4EFE8" stroke-width="5.4" stroke-linecap="round" transform="rotate(60 165 230)"/><line x1="165" y1="221.8" x2="165" y2="196.0" stroke="#F4EFE8" stroke-width="5.4" stroke-linecap="round" transform="rotate(90 165 230)"/><line x1="165" y1="221.8" x2="165" y2="202.8" stroke="#F4EFE8" stroke-width="5.4" stroke-linecap="round" transform="rotate(120 165 230)"/><line x1="165" y1="221.8" x2="165" y2="196.0" stroke="#F4EFE8" stroke-width="5.4" stroke-linecap="round" transform="rotate(150 165 230)"/><line x1="165" y1="221.8" x2="165" y2="202.8" stroke="#F4EFE8" stroke-width="5.4" stroke-linecap="round" transform="rotate(180 165 230)"/><line x1="165" y1="221.8" x2="165" y2="196.0" stroke="#F4EFE8" stroke-width="5.4" stroke-linecap="round" transform="rotate(210 165 230)"/><line x1="165" y1="221.8" x2="165" y2="202.8" stroke="#F4EFE8" stroke-width="5.4" stroke-linecap="round" transform="rotate(240 165 230)"/><line x1="165" y1="221.8" x2="165" y2="196.0" stroke="#F4EFE8" stroke-width="5.4" stroke-linecap="round" transform="rotate(270 165 230)"/><line x1="165" y1="221.8" x2="165" y2="202.8" stroke="#F4EFE8" stroke-width="5.4" stroke-linecap="round" transform="rotate(300 165 230)"/><line x1="165" y1="221.8" x2="165" y2="196.0" stroke="#F4EFE8" stroke-width="5.4" stroke-linecap="round" transform="rotate(330 165 230)"/><text x="165" y="322" font-size="26" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="middle">Claude</text><text x="165" y="350" font-size="15" font-weight="500" fill="#0A0B0F" fill-opacity="0.7" text-anchor="middle">You type what you want</text><g filter="url(#sh)"><rect x="355" y="150" width="250" height="230" rx="24" fill="#F4EFE8"/></g><polygon points="480.0,180.0 525.0,206.0 525.0,258.0 480.0,284.0 435.0,258.0 435.0,206.0" fill="#0A0B0F" stroke="#D3722A" stroke-width="5"/><line x1="466" y1="250" x2="473" y2="214" stroke="#F4EFE8" stroke-width="7" stroke-linecap="round"/><line x1="480" y1="250" x2="487" y2="214" stroke="#F4EFE8" stroke-width="7" stroke-linecap="round"/><line x1="494" y1="250" x2="501" y2="214" stroke="#F4EFE8" stroke-width="7" stroke-linecap="round"/><text x="480" y="322" font-size="26" font-weight="800" fill="#0A0B0F" fill-opacity="1" text-anchor="middle">MCP server</text><text x="480" y="350" font-size="15" font-weight="500" fill="#0A0B0F" fill-opacity="0.7" text-anchor="middle">A small helper program</text><g filter="url(#sh)"><rect x="670" y="150" width="250" height="230" rx="14" fill="#F4EFE8"/><path d="M670 186V164a14 14 0 0 1 14 -14H906a14 14 0 0 1 14 14V186z" fill="#E3DCD1"/></g><circle cx="690" cy="168" r="5" fill="#E5736B"/><circle cx="708" cy="168" r="5" fill="#E8B04A"/><circle cx="726" cy="168" r="5" fill="#5DBB73"/><text x="795.0" y="173" text-anchor="middle" font-size="13" font-weight="600" fill="#0A0B0F" fill-opacity=".65">Your software</text><rect x="690" y="200" width="100" height="70" rx="8" fill="#2E8B7F" fill-opacity=".35"/><rect x="800" y="200" width="100" height="70" rx="8" fill="#D3722A" fill-opacity=".35"/><rect x="690" y="282" width="210" height="14" rx="7" fill="#0A0B0F" fill-opacity=".15"/><rect x="690" y="304" width="150" height="14" rx="7" fill="#0A0B0F" fill-opacity=".15"/><text x="795" y="352" font-size="14" font-weight="700" fill="#0A0B0F" fill-opacity="0.75" text-anchor="middle">Revit · Blender · SketchUp…</text><path d="M296 265 L349 265" fill="none" stroke="#F2904C" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah)"/><path d="M611 265 L664 265" fill="none" stroke="#F2904C" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="322" y="246" font-size="14" font-weight="700" fill="#F2904C" fill-opacity="1" text-anchor="middle">asks</text><text x="638" y="246" font-size="14" font-weight="700" fill="#F2904C" fill-opacity="1" text-anchor="middle">does it</text><text x="40" y="432" font-size="17" font-weight="500" fill="#F4EFE8" fill-opacity="0.92" text-anchor="start">1  You ask Claude in plain words, like "list every door without a fire rating".</text><text x="40" y="462" font-size="17" font-weight="500" fill="#F4EFE8" fill-opacity="0.92" text-anchor="start">2  The MCP server turns that into real commands for your software.</text><text x="40" y="492" font-size="17" font-weight="500" fill="#F4EFE8" fill-opacity="0.92" text-anchor="start">3  The software does the work, and Claude reads the result.</text><text x="920" y="492" font-size="14" font-weight="600" fill="#F2904C" fill-opacity="1" text-anchor="end">Some software needs a small plugin too.</text></g></svg>