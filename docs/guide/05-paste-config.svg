<rect width="960" height="540" rx="26" fill="url(#bg)"/><rect width="960" height="540" rx="26" fill="url(#grid)"/><rect width="960" height="540" rx="26" fill="url(#gl)"/>
<g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"><circle cx="64" cy="62" r="24" fill="#D3722A"/><text x="64" y="71" text-anchor="middle" font-size="26" font-weight="800" fill="#0A0B0F">3</text><text x="104" y="72" font-size="34" font-weight="800" fill="#F4EFE8">Paste the server's snippet</text><text x="104" y="102" font-size="18" fill="#F4EFE8" fill-opacity=".78">Every server README gives you a block like this. Copy it exactly.</text><g filter="url(#sh)"><rect x="40" y="130" width="560" height="330" rx="14" fill="#1B2125"/><path d="M40 166V144a14 14 0 0 1 14 -14H586a14 14 0 0 1 14 14V166z" fill="#262E33"/></g><circle cx="60" cy="148" r="5" fill="#E5736B"/><circle cx="78" cy="148" r="5" fill="#E8B04A"/><circle cx="96" cy="148" r="5" fill="#5DBB73"/><text x="320.0" y="153" text-anchor="middle" font-size="13" font-weight="600" fill="#F4EFE8" fill-opacity=".65">claude_desktop_config.json</text><text x="66" y="192" font-size="14" font-weight="400" fill="#F4EFE8" fill-opacity="0.35" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">1</text><text x="66" y="224" font-size="14" font-weight="400" fill="#F4EFE8" fill-opacity="0.35" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">2</text><text x="66" y="256" font-size="14" font-weight="400" fill="#F4EFE8" fill-opacity="0.35" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">3</text><text x="66" y="288" font-size="14" font-weight="400" fill="#F4EFE8" fill-opacity="0.35" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">4</text><text x="66" y="320" font-size="14" font-weight="400" fill="#F4EFE8" fill-opacity="0.35" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">5</text><text x="66" y="352" font-size="14" font-weight="400" fill="#F4EFE8" fill-opacity="0.35" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">6</text><text x="66" y="384" font-size="14" font-weight="400" fill="#F4EFE8" fill-opacity="0.35" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">7</text><text x="66" y="416" font-size="14" font-weight="400" fill="#F4EFE8" fill-opacity="0.35" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">8</text><rect x="140" y="234" width="111" height="30" rx="6" fill="#D3722A" fill-opacity=".28" stroke="#F2904C" stroke-width="2"/><rect x="287" y="266" width="65" height="30" rx="6" fill="#D3722A" fill-opacity=".28" stroke="#F2904C" stroke-width="2"/><rect x="265" y="298" width="202" height="30" rx="6" fill="#D3722A" fill-opacity=".28" stroke="#F2904C" stroke-width="2"/><text x="100" y="192" font-size="19" font-weight="600" fill="#F4EFE8" fill-opacity="1" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">{</text><text x="122" y="224" font-size="19" font-weight="600" fill="#F4EFE8" fill-opacity="1" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">"mcpServers": {</text><text x="144" y="256" font-size="19" font-weight="600" fill="#F4EFE8" fill-opacity="1" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">"blender": {</text><text x="166" y="288" font-size="19" font-weight="600" fill="#F4EFE8" fill-opacity="1" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">"command": "uvx",</text><text x="166" y="320" font-size="19" font-weight="600" fill="#F4EFE8" fill-opacity="1" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">"args": ["mcp-for-blender"]</text><text x="144" y="352" font-size="19" font-weight="600" fill="#F4EFE8" fill-opacity="1" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">}</text><text x="122" y="384" font-size="19" font-weight="600" fill="#F4EFE8" fill-opacity="1" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">}</text><text x="100" y="416" font-size="19" font-weight="600" fill="#F4EFE8" fill-opacity="1" text-anchor="start" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">}</text><circle cx="307" cy="248" r="13" fill="#D3722A"/><text x="307" y="254" text-anchor="middle" font-size="16" font-weight="800" fill="#0A0B0F">1</text><circle cx="386" cy="280" r="13" fill="#D3722A"/><text x="386" y="286" text-anchor="middle" font-size="16" font-weight="800" fill="#0A0B0F">2</text><circle cx="488" cy="312" r="13" fill="#D3722A"/><text x="488" y="318" text-anchor="middle" font-size="16" font-weight="800" fill="#0A0B0F">3</text><circle cx="640" cy="170" r="16" fill="#D3722A"/><text x="640" y="176" text-anchor="middle" font-size="17" font-weight="800" fill="#0A0B0F">1</text><text x="668" y="176" font-size="19" font-weight="800" fill="#F4EFE8" fill-opacity="1" text-anchor="start">Any name you like</text><text x="668" y="200" font-size="15" font-weight="500" fill="#F4EFE8" fill-opacity="0.7" text-anchor="start">It shows up in Claude</text><circle cx="640" cy="270" r="16" fill="#D3722A"/><text x="640" y="276" text-anchor="middle" font-size="17" font-weight="800" fill="#0A0B0F">2</text><text x="668" y="276" font-size="19" font-weight="800" fill="#F4EFE8" fill-opacity="1" text-anchor="start">The tool that starts it</text><text x="668" y="300" font-size="15" font-weight="500" fill="#F4EFE8" fill-opacity="0.7" text-anchor="start">Usually uvx or npx</text><circle cx="640" cy="370" r="16" fill="#D3722A"/><text x="640" y="376" text-anchor="middle" font-size="17" font-weight="800" fill="#0A0B0F">3</text><text x="668" y="376" font-size="19" font-weight="800" fill="#F4EFE8" fill-opacity="1" text-anchor="start">The server package name</text><text x="668" y="400" font-size="15" font-weight="500" fill="#F4EFE8" fill-opacity="0.7" text-anchor="start">Copy it from the README</text><g filter="url(#sh)"><rect x="40" y="476" width="880" height="44" rx="12" fill="#F4EFE8"/></g><text x="60" y="504" font-size="15" font-weight="700" fill="#0A0B0F" fill-opacity="1" text-anchor="start">Already have servers? Add yours inside the same "mcpServers" list, separated by a comma. Then save.</text></g></svg>