<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Paste the server link into Claude and ask it to install">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F5D56"/><stop offset=".55" stop-color="#16302C"/><stop offset="1" stop-color="#0A0B0F"/></linearGradient>
<radialGradient id="gl" cx="1" cy=".4" r=".75"><stop offset="0" stop-color="#F2904C" stop-opacity=".5"/><stop offset=".5" stop-color="#D3722A" stop-opacity=".1"/><stop offset="1" stop-color="#D3722A" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#F4EFE8" stroke-opacity=".06"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F2904C"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".4"/></filter>
</defs>
<rect width="960" height="540" rx="26" fill="url(#bg)"/><rect width="960" height="540" rx="26" fill="url(#grid)"/><rect width="960" height="540" rx="26" fill="url(#gl)"/>
<circle cx="896" cy="62" r="24" fill="#D3722A"/><text xml:space="preserve" x="896" y="71" text-anchor="middle" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#0A0B0F" fill-opacity="1">1</text>
<text x="856" y="72" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="#F4EFE8" fill-opacity="1">خلّي Claude يركّب لك</text>
<text x="856" y="104" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#F4EFE8" fill-opacity="0.8">افتح Claude Code، الصق الرابط، واطلب منه يركّب</text>
<g filter="url(#sh)"><rect x="60" y="130" width="840" height="360" rx="14" fill="#F4EFE8" fill-opacity="1"/><path d="M60 166V144a14 14 0 0 1 14 -14H886a14 14 0 0 1 14 14V166z" fill="#E3DCD1"/></g><circle cx="80" cy="148" r="5" fill="#E5736B"/><circle cx="98" cy="148" r="5" fill="#E8B04A"/><circle cx="116" cy="148" r="5" fill="#5DBB73"/><text xml:space="preserve" x="480.0" y="153" text-anchor="middle" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#0A0B0F" fill-opacity="0.7">Claude Code</text><rect x="240" y="172" width="640" height="150" rx="16" fill="#D3722A" fill-opacity="1"/><text x="862" y="206" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#0A0B0F" fill-opacity="1">ركّب لي الـ MCP server ده على جهازي</text><text x="862" y="236" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#0A0B0F" fill-opacity="1">واتبع خطوات الـ README بتاعه خطوة خطوة.</text><text x="862" y="266" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#0A0B0F" fill-opacity="1">اشرح لي أي حاجة لازم أعملها بإيدي:</text><rect x="262" y="280" width="400" height="32" rx="8" fill="#0A0B0F" fill-opacity="1"/><text xml:space="preserve" x="462" y="302" text-anchor="middle" font-family="Consolas,'SF Mono','Courier New',monospace" font-size="15" font-weight="400" fill="#F4EFE8" fill-opacity="1">github.com/mcp-servers-for-revit/…</text><circle cx="250" cy="180" r="15" fill="#D3722A" stroke="#0A0B0F" stroke-width="2"/><text xml:space="preserve" x="250" y="186" text-anchor="middle" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="800" fill="#0A0B0F" fill-opacity="1">1</text><text x="224" y="214" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#F4EFE8" fill-opacity="0">← الصق الرابط بتاع السيرفر</text><rect x="90" y="344" width="500" height="124" rx="14" fill="#E3DCD1" fill-opacity="1"/><text x="574" y="380" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#0A0B0F" fill-opacity="1">تمام! هقرا الـ README وأبدأ التركيب.</text><text x="574" y="414" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#0A0B0F" fill-opacity="0.75">هسألك قبل أي أمر، وهقولك لو في حاجة</text><text x="574" y="442" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#0A0B0F" fill-opacity="0.75">لازم تعملها بإيدك.</text><rect x="620" y="344" width="260" height="124" rx="14" fill="#16302C" fill-opacity="1"/><text xml:space="preserve" x="750" y="380" text-anchor="middle" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#F4EFE8" fill-opacity="1">Claude عايز يشغّل أمر</text><rect x="640" y="400" width="100" height="34" rx="8" fill="#5DBB73" fill-opacity="1"/><text xml:space="preserve" x="690" y="423" text-anchor="middle" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#0A0B0F" fill-opacity="1">Allow</text><rect x="752" y="400" width="100" height="34" rx="8" fill="#E5736B" fill-opacity="1"/><text xml:space="preserve" x="802" y="423" text-anchor="middle" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#0A0B0F" fill-opacity="1">Deny</text><text xml:space="preserve" x="750" y="456" text-anchor="middle" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="500" fill="#F4EFE8" fill-opacity="0.8">اقرا الأمر قبل ما توافق</text><circle cx="880" cy="344" r="15" fill="#D3722A" stroke="#0A0B0F" stroke-width="2"/><text xml:space="preserve" x="880" y="350" text-anchor="middle" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="800" fill="#0A0B0F" fill-opacity="1">2</text>
</svg>
