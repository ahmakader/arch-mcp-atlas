<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="How to open Command Prompt or Terminal">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F5D56"/><stop offset=".55" stop-color="#16302C"/><stop offset="1" stop-color="#0A0B0F"/></linearGradient>
<radialGradient id="gl" cx="1" cy=".4" r=".75"><stop offset="0" stop-color="#F2904C" stop-opacity=".5"/><stop offset=".5" stop-color="#D3722A" stop-opacity=".1"/><stop offset="1" stop-color="#D3722A" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#F4EFE8" stroke-opacity=".06"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F2904C"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".4"/></filter>
</defs>
<rect width="960" height="540" rx="26" fill="url(#bg)"/><rect width="960" height="540" rx="26" fill="url(#grid)"/><rect width="960" height="540" rx="26" fill="url(#gl)"/>

<text x="912" y="72" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="#F4EFE8" fill-opacity="1">إزاي أفتح الـ CMD (أو Terminal)؟</text>
<text x="912" y="104" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#F4EFE8" fill-opacity="0.8">هتحتاجه مرة أو اتنين، ومش لازم تفهم الأوامر. بس انسخ والصق</text>
<g filter="url(#sh)"><rect x="500" y="130" width="420" height="360" rx="14" fill="#F4EFE8" fill-opacity="1"/><path d="M500 166V144a14 14 0 0 1 14 -14H906a14 14 0 0 1 14 14V166z" fill="#E3DCD1"/></g><circle cx="520" cy="148" r="5" fill="#E5736B"/><circle cx="538" cy="148" r="5" fill="#E8B04A"/><circle cx="556" cy="148" r="5" fill="#5DBB73"/><text xml:space="preserve" x="710.0" y="153" text-anchor="middle" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#0A0B0F" fill-opacity="0.7">ويندوز · Windows</text><circle cx="534" cy="190" r="15" fill="#D3722A" stroke="#0A0B0F" stroke-width="2"/><text xml:space="preserve" x="534" y="196" text-anchor="middle" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="800" fill="#0A0B0F" fill-opacity="1">1</text><text x="884" y="196" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#0A0B0F" fill-opacity="1">اضغط زر Windows ⊞ في الكيبورد</text><rect x="530" y="224" width="360" height="44" rx="22" fill="#fff" fill-opacity="1" stroke="#CFC6B8" stroke-width="2"/><text xml:space="preserve" x="560" y="253" text-anchor="start" font-family="Consolas,'SF Mono','Courier New',monospace" font-size="20" font-weight="400" fill="#0A0B0F" fill-opacity="1">cmd</text><text xml:space="preserve" x="870" y="252" text-anchor="middle" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#0A0B0F" fill-opacity="1">🔍</text><circle cx="534" cy="300" r="15" fill="#D3722A" stroke="#0A0B0F" stroke-width="2"/><text xml:space="preserve" x="534" y="306" text-anchor="middle" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="800" fill="#0A0B0F" fill-opacity="1">2</text><text x="884" y="306" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#0A0B0F" fill-opacity="1">اكتب  cmd  من غير ما تدوس أي حاجة</text><rect x="530" y="330" width="360" height="54" rx="10" fill="#E8E1D6" fill-opacity="1"/><rect x="542" y="342" width="30" height="30" rx="6" fill="#0A0B0F" fill-opacity="1"/><text xml:space="preserve" x="557" y="365" text-anchor="middle" font-family="Consolas,'SF Mono','Courier New',monospace" font-size="15" font-weight="700" fill="#F4EFE8" fill-opacity="1">&gt;_</text><text xml:space="preserve" x="870" y="364" text-anchor="end" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600" fill="#0A0B0F" fill-opacity="1">Command Prompt</text><circle cx="534" cy="420" r="15" fill="#D3722A" stroke="#0A0B0F" stroke-width="2"/><text xml:space="preserve" x="534" y="426" text-anchor="middle" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="800" fill="#0A0B0F" fill-opacity="1">3</text><text x="884" y="426" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#0A0B0F" fill-opacity="1">اضغط Enter، هتفتح شاشة سودا</text><rect x="530" y="442" width="360" height="36" rx="8" fill="#0A0B0F" fill-opacity="1"/><text xml:space="preserve" x="548" y="466" text-anchor="start" font-family="Consolas,'SF Mono','Courier New',monospace" font-size="16" font-weight="400" fill="#5DBB73" fill-opacity="1">C:\Users\you&gt;_</text><g filter="url(#sh)"><rect x="40" y="130" width="440" height="360" rx="14" fill="#F4EFE8" fill-opacity="1"/><path d="M40 166V144a14 14 0 0 1 14 -14H466a14 14 0 0 1 14 14V166z" fill="#E3DCD1"/></g><circle cx="60" cy="148" r="5" fill="#E5736B"/><circle cx="78" cy="148" r="5" fill="#E8B04A"/><circle cx="96" cy="148" r="5" fill="#5DBB73"/><text xml:space="preserve" x="260.0" y="153" text-anchor="middle" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill=