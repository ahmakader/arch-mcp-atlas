d" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600" fill="#0A0B0F" fill-opacity="1">Terminal</text><circle cx="74" cy="420" r="15" fill="#D3722A" stroke="#0A0B0F" stroke-width="2"/><text xml:space="preserve" x="74" y="426" text-anchor="middle" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="800" fill="#0A0B0F" fill-opacity="1">3</text><text x="444" y="426" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#0A0B0F" fill-opacity="1">هتفتح شاشة فيها سطر أوامر</text><rect x="70" y="442" width="380" height="36" rx="8" fill="#0A0B0F" fill-opacity="1"/><text xml:space="preserve" x="88" y="466" text-anchor="start" font-family="Consolas,'SF Mono','Courier New',monospace" font-size="16" font-weight="400" fill="#5DBB73" fill-opacity="1">you@mac ~ %_</text>
