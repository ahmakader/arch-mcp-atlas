<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Two ways to install an MCP server">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F5D56"/><stop offset=".55" stop-color="#16302C"/><stop offset="1" stop-color="#0A0B0F"/></linearGradient>
<radialGradient id="gl" cx="1" cy=".4" r=".75"><stop offset="0" stop-color="#F2904C" stop-opacity=".5"/><stop offset=".5" stop-color="#D3722A" stop-opacity=".1"/><stop offset="1" stop-color="#D3722A" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#F4EFE8" stroke-opacity=".06"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F2904C"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".4"/></filter>
</defs>
<rect width="960" height="540" rx="26" fill="url(#bg)"/><rect width="960" height="540" rx="26" fill="url(#grid)"/><rect width="960" height="540" rx="26" fill="url(#gl)"/>

<text x="912" y="72" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="#F4EFE8" fill-opacity="1">فيه طريقتين لتركيب أي سيرفر</text>
<text x="912" y="104" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#F4EFE8" fill-opacity="0.8">ابدأ بالأولى، ولو وقفت جرّب التانية</text>
<g filter="url(#sh)"><rect x="500" y="150" width="420" height="340" rx="18" fill="#F4EFE8" fill-opacity="1"/><rect x="40" y="150" width="420" height="340" rx="18" fill="#E8E1D6" fill-opacity="1"/></g><rect x="500" y="150" width="420" height="56" rx="18" fill="#D3722A" fill-opacity="1"/><rect x="500" y="190" width="420" height="16" rx="0" fill="#D3722A" fill-opacity="1"/><text x="900" y="188" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="800" fill="#0A0B0F" fill-opacity="1">الطريقة 1  ⭐ الأسهل</text><text x="900" y="250" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#0A0B0F" fill-opacity="1">تدّي Claude رابط السيرفر</text><text x="900" y="284" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#0A0B0F" fill-opacity="1">وهو اللي يركّبه ويمشي</text><text x="900" y="318" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#0A0B0F" fill-opacity="1">على خطوات الـ README.</text><rect x="520" y="350" width="380" height="56" rx="12" fill="#0A0B0F" fill-opacity="1"/><text xml:space="preserve" x="710" y="385" text-anchor="middle" font-family="Consolas,'SF Mono','Courier New',monospace" font-size="18" font-weight="400" fill="#F4EFE8" fill-opacity="1">github.com/…/server</text><text x="900" y="446" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600" fill="#0A0B0F" fill-opacity="0.7">⏱ حوالي 5 دقايق</text><rect x="40" y="150" width="420" height="56" rx="18" fill="#1F5D56" fill-opacity="1"/><rect x="40" y="190" width="420" height="16" rx="0" fill="#1F5D56" fill-opacity="1"/><text x="440" y="188" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="800" fill="#F4EFE8" fill-opacity="1">الطريقة 2  بإيدك</text><text x="440" y="250" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#0A0B0F" fill-opacity="1">خطوة خطوة على جهازك</text><text x="440" y="284" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#0A0B0F" fill-opacity="1">(هنشرح مثال Revit)</text><text x="440" y="318" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#0A0B0F" fill-opacity="1">ولو ما نفعتش الأولى.</text><rect x="60" y="350" width="116" height="56" rx="12" fill="#D9D1C4" fill-opacity="1"/><text xml:space="preserve" x="118" y="385" text-anchor="middle" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#0A0B0F" fill-opacity="1">تنزيل</text><rect x="188" y="350" width="116" height="56" rx="12" fill="#D9D1C4" fill-opacity="1"/><text xml:space="preserve" x="246" y="385" text-anchor="middle" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#0A0B0F" fill-opacity="1">نسخ</text><rect x="316" y="350" width="116" height="56" rx="12" fill="#D9D1C4" fill-opacity="1"/><text xml:space="preserve" x="374" y="385" text-anchor="middle" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#0A0B0F" fill-opacity="1">إعدادات</text><text x="440" y="446" direction="rtl" text-anchor="start" font-family="'Segoe UI',Tahoma,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600" fill="#0A0B0F" fill-opacity="0.7">⏱ حوالي 15 دقيقة</text>
</svg>
